name: Python SDK

# Three tiers and no controller, the type checks, and both wheel tiers.
# Everything the core contributes is fetched from one of its releases and
# checked against that release's manifest, so nothing here needs a checkout of
# the core or a build of it.
#
# What this cannot prove is the capability vocabulary the controller owns:
# persistence, effectively-once, correction, partitioning, steps relays, liveness,
# restarts. Those are end-to-end scenarios and they run in the core's tree,
# against the commit it pins this repository at.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  # The core release every tier is proven against. One tag decides the
  # extension module, the fake controller and the contract set, so a change to
  # it is one line.
  CORE_VERSION: "0.1.0"
  CORE_RELEASE: https://github.com/flezha/flezha/releases/download/v0.1.0
  CARGO_TERM_COLOR: always

jobs:
  # Unit, local mode, smoke and the lint, on the declared floor, the newest
  # stable and a free-threaded build. The free-threaded arm is `3.14t` and not
  # `3.13t`: PyO3 refuses the free-threaded build of CPython below 3.14.
  tiers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Run the three tiers
        env:
          FLEZHA_PYTHON: python
        run: scripts/ci.sh --core "$CORE_RELEASE" --version "$CORE_VERSION"

  # The graph is statically checkable or it is not; this is where that is
  # decided. `test_typing.py` runs inside the suite too, but a dedicated job
  # means a type regression names itself rather than arriving as one of a
  # hundred test failures.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the dev group
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet "pip>=25.1"
          .venv/bin/python -m pip install --quiet --group dev

      # The fixtures that must fail are judged by tests/test_typing.py, which
      # asserts each fixture's error count, the types named and the line.
      - name: Type-check the package and its tests
        run: PYTHONPATH=src .venv/bin/pyright --pythonpath .venv/bin/python src/flezha tests

  # Both wheel tiers, built from the wrapper crate, whose one dependency is the
  # core at a git tag, so a job needs cargo and git and no checkout of the core.
  # The compatibility tier is one `abi3` wheel targeting the declared floor; the
  # performance tier is per version, because `abi3` has no free-threaded form
  # before CPython 3.15. The per-triple set a release publishes is built by the
  # core's release job.
  wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: abi3
            python: "3.11"
            features: python-extension,python-abi3
          - tier: free-threaded
            python: "3.14t"
            features: python-extension
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install "maturin>=1.9,<2.0"

      - name: Build the ${{ matrix.tier }} wheel
        run: maturin build --release --out dist --features ${{ matrix.features }}

      # Installation must need no Rust toolchain: the wheel either carries the
      # library or it does not.
      - name: Install the wheel and import the extension
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/python -c "
          import flezha
          from flezha import native
          print(flezha.__version__, native.build_tier())
          assert native.load_extension().schema_version() == native.ACTIVATION_SCHEMA_VERSION
          "

      - uses: actions/upload-artifact@v4
        with:
          name: flezha-wheel-${{ matrix.tier }}
          path: dist/*.whl

  # The source distribution stays the fallback for a platform with no prebuilt
  # wheel, so it has to build.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install "maturin>=1.9,<2.0"

      - name: Build the source distribution
        run: maturin sdist --out dist
